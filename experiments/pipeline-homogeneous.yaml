experiment:
  name: pipeline-homogeneous
  type: pipeline
  task: code_review

  steps:
    - name: reviewer
      provider: vertex
      model: claude-sonnet-4-6
      temperature: 0
      system_prompt_file: reviewer_system.md
      user_prompt_file: reviewer_user.md

    - name: implementer
      provider: vertex
      model: claude-sonnet-4-6
      temperature: 0
      system_prompt_file: implementer_system.md
      user_prompt_file: implementer_user.md

    - name: verifier
      provider: vertex
      model: claude-sonnet-4-6
      temperature: 0
      system_prompt_file: verifier_system.md
      user_prompt_file: verifier_user.md
