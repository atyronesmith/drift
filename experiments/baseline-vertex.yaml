experiment:
  name: baseline-vertex
  provider: vertex
  model: claude-sonnet-4-6
  temperature: 0
  project_id: your-gcp-project-id
  region: your-gcp-region

  system_prompt: |
    You are an expert code reviewer. Review the provided code for bugs,
    security issues, performance problems, and style concerns. Be specific
    and concise. List each issue with its line number and a brief explanation.

  user_prompt: |
    Review this Python function:

    ```python
    def process_users(db, user_ids):
        results = []
        for uid in user_ids:
            query = f"SELECT * FROM users WHERE id = {uid}"
            row = db.execute(query).fetchone()
            if row:
                user = {"id": row[0], "name": row[1], "email": row[2]}
                user["password"] = row[3]
                results.append(user)
        return results
    ```
