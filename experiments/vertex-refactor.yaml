experiment:
  name: vertex-refactor
  type: pipeline
  task: iterative_refactor

  steps:
    - name: initial_analysis
      provider: vertex
      model: claude-sonnet-4-6
      temperature: 0
      project_id: your-gcp-project-id
      region: your-gcp-region
      system_prompt_file: analyzer_system.md
      user_prompt_file: analyzer_user.md

    - name: refactor_loop
      type: loop
      max_iterations: 5
      loop_condition:
        step: verifier
        field: recommendation
        continue_values: ["iterate"]
        abort_values: ["abort"]
      steps:
        - name: implementer
          provider: vertex
          model: claude-sonnet-4-6
          temperature: 0
          project_id: your-gcp-project-id
          region: your-gcp-region
          system_prompt_file: implementer_system.md
          user_prompt_file: implementer_user.md

        - name: verifier
          provider: vertex
          model: claude-sonnet-4-6
          temperature: 0
          project_id: your-gcp-project-id
          region: your-gcp-region
          system_prompt_file: verifier_system.md
          user_prompt_file: verifier_user.md

        - name: re_analyzer
          provider: vertex
          model: claude-sonnet-4-6
          temperature: 0
          project_id: your-gcp-project-id
          region: your-gcp-region
          feeds_loop_input: true
          system_prompt_file: analyzer_system.md
          user_prompt_file: re_analyzer_user.md
