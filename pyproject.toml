[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drift"
version = "0.1.0"
description = "Measure output variability across multi-agent LLM pipelines"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "python-Levenshtein>=0.25",
    "click>=8.1",
    "anthropic[vertex]>=0.40",
    "python-dotenv>=1.0",
]

[project.scripts]
drift = "drift.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/drift"]
