# Auto-generated by: drift synthesize
# Validated rules only (overfit rules removed).
# Severity mapping discovered via multi-ticket conditional analysis (39 tickets).

rules:
  - path: ticket.id
    type: regex
    pattern: "Ticket\\ ID:\\s*(\\S+)\\s*$"

  - path: ticket.subject
    type: regex
    pattern: "Subject:\\s*(.+?)\\s*$"

  - path: ticket.requester_email
    type: regex
    pattern: "From:\\s*([\\w.+-]+@[\\w.-]+)\\s*$"

  - path: ticket.created_at
    type: regex
    pattern: "Created:\\s*(\\S+)\\s*$"

  - path: ticket.stated_priority
    type: regex
    pattern: "Priority:\\s*(\\S+)\\s*$"

  - path: ticket.stated_category
    type: regex
    pattern: "Category:\\s*(\\S+)\\s*$"

  # Severity: discovered via conditional determinism analysis.
  # Medium→P3 (100% across 27 tickets), High→P2 (92% across 12 tickets).
  # One outlier: High+Account can produce P3 for setup/config tasks.
  - path: assessment.severity
    type: conditional
    conditions:
      - when:
          ticket.stated_priority: High
          ticket.stated_category: Account
        value: P3
      - when:
          ticket.stated_priority: High
        value: P2
      - when:
          ticket.stated_priority: Medium
        value: P3
      - when:
          ticket.stated_priority: Low
        value: P4
      - when:
          ticket.stated_priority: Urgent
        value: P1
    default: P3

llm_fields:
  - assessment

output_mode: merge
